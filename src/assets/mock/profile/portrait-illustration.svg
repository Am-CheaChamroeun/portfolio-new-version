<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5F5E9"/>
      <stop offset="1" stop-color="#E6E6D4"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBFBF4"/>
      <stop offset="1" stop-color="#DCDCC8"/>
    </linearGradient>
    <linearGradient id="jacket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2E33"/>
      <stop offset="1" stop-color="#0B0D0F"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" stroke="#2A2E33" stroke-opacity="0.07"/>
    </pattern>
    <clipPath id="frame"><rect width="600" height="600"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="600" height="600" fill="url(#bg)"/>
    <rect width="600" height="600" fill="url(#grid)"/>

    <!-- construction guides, like a pencil study -->
    <g stroke="#D9C800" stroke-opacity="0.35" stroke-width="1.2" stroke-dasharray="6 7">
      <path d="M300 40 V600"/>
      <path d="M120 236 H480"/>
      <circle cx="300" cy="230" r="128"/>
    </g>
    <g stroke="#D9C800" stroke-opacity="0.5" stroke-width="1.2">
      <path d="M112 236 h-14 M488 236 h14"/>
      <path d="M300 92 v-16"/>
    </g>

    <!-- shoulders / jacket -->
    <path d="M86 600 C 96 470, 180 420, 300 418 C 420 420, 504 470, 514 600 Z" fill="url(#jacket)"/>
    <path d="M232 430 L300 520 L368 430" fill="#F5F5E9"/>
    <path d="M232 430 L300 520 L368 430" stroke="#0B0D0F" stroke-width="3" stroke-linejoin="round"/>
    <path d="M300 520 V600" stroke="#08090A" stroke-opacity="0.5" stroke-width="2"/>
    <path d="M210 440 C 236 470, 252 500, 262 560" stroke="#D9C800" stroke-opacity="0.45" stroke-width="2" stroke-linecap="round"/>
    <path d="M390 440 C 364 470, 348 500, 338 560" stroke="#D9C800" stroke-opacity="0.45" stroke-width="2" stroke-linecap="round"/>

    <!-- neck -->
    <path d="M262 340 V420 Q300 446 338 420 V340" fill="url(#skin)"/>
    <path d="M262 352 V420 Q300 446 338 420 V352" stroke="#2A2E33" stroke-width="3" stroke-linecap="round"/>

    <!-- head -->
    <ellipse cx="300" cy="238" rx="104" ry="124" fill="url(#skin)"/>
    <ellipse cx="300" cy="238" rx="104" ry="124" stroke="#2A2E33" stroke-width="3.5"/>
    <!-- second, offset pencil stroke -->
    <path d="M200 226 C 200 150, 246 112, 302 112 C 360 112, 404 154, 404 230" stroke="#0B0D0F" stroke-opacity="0.35" stroke-width="1.6" stroke-linecap="round"/>

    <!-- hair mass (abstract) -->
    <path d="M194 238 C 186 150, 236 102, 304 102 C 370 102, 418 146, 408 226 C 396 190, 372 168, 336 162 C 300 186, 248 186, 214 178 C 202 196, 196 214, 194 238 Z" fill="#0B0D0F"/>
    <path d="M226 170 C 256 150, 300 146, 340 156" stroke="#D9C800" stroke-opacity="0.6" stroke-width="2.4" stroke-linecap="round"/>

    <!-- ears -->
    <path d="M198 236 c -18 -4 -24 34 -4 44" stroke="#2A2E33" stroke-width="3" stroke-linecap="round" fill="url(#skin)"/>
    <path d="M402 236 c 18 -4 24 34 4 44" stroke="#2A2E33" stroke-width="3" stroke-linecap="round" fill="url(#skin)"/>

    <!-- shading hatch on the cheek -->
    <g stroke="#2A2E33" stroke-opacity="0.18" stroke-width="2" stroke-linecap="round">
      <path d="M362 268 l22 -22 M366 284 l24 -24 M372 298 l20 -20"/>
    </g>

    <!-- pencil resting in the corner -->
    <g transform="rotate(-40 488 520)">
      <rect x="400" y="510" width="150" height="16" fill="#2A2E33"/>
      <rect x="400" y="510" width="150" height="5" fill="#EFFF00"/>
      <rect x="550" y="510" width="14" height="16" fill="#B9BDC3"/>
      <path d="M564 510 h8 a6 6 0 0 1 6 6 v4 a6 6 0 0 1 -6 6 h-8 z" fill="#E6E6D4"/>
      <path d="M400 510 L378 518 L400 526 Z" fill="#F0D9B2"/>
      <path d="M385 515.5 L378 518 L385 520.5 Z" fill="#0B0D0F"/>
    </g>
  </g>
</svg>
