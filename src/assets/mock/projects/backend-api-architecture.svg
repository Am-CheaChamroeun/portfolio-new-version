<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" fill="none">
  <defs>
    <pattern id="fine" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" stroke="#F5F5E9" stroke-opacity="0.06"/>
    </pattern>
    <pattern id="major" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M100 0H0V100" stroke="#F5F5E9" stroke-opacity="0.13"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#F5F5E9"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#EFFF00"/>
    </marker>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="#0B0D0F"/>
  <rect width="1600" height="900" fill="url(#fine)"/>
  <rect width="1600" height="900" fill="url(#major)"/>
  <circle cx="800" cy="450" r="180" fill="#EFFF00" opacity="0.18" filter="url(#glow)"/>

  <!-- clients -->
  <g stroke="#F5F5E9" stroke-width="3" stroke-linejoin="round">
    <rect x="110" y="250" width="170" height="116" rx="14"/>
    <path d="M110 280 H280"/>
    <rect x="148" y="300" width="60" height="44" rx="6" fill="#F5F5E9" fill-opacity="0.15"/>
    <rect x="160" y="520" width="78" height="140" rx="16"/>
    <path d="M186 640 h26"/>
  </g>
  <g fill="#F5F5E9">
    <circle cx="128" cy="265" r="4"/><circle cx="142" cy="265" r="4" fill-opacity="0.6"/><circle cx="156" cy="265" r="4" fill-opacity="0.35"/>
    <rect x="220" y="304" width="44" height="8" rx="4" fill-opacity="0.6"/>
    <rect x="220" y="320" width="34" height="8" rx="4" fill-opacity="0.4"/>
    <rect x="176" y="548" width="46" height="34" rx="6" fill-opacity="0.15"/>
    <rect x="176" y="596" width="46" height="8" rx="4" fill-opacity="0.5"/>
    <rect x="176" y="612" width="32" height="8" rx="4" fill-opacity="0.35"/>
  </g>

  <!-- gateway -->
  <rect x="520" y="300" width="200" height="300" rx="22" fill="#191C20" stroke="#F5F5E9" stroke-width="3"/>
  <path d="M560 360 h120 M560 400 h90" stroke="#F5F5E9" stroke-width="10" stroke-linecap="round" stroke-opacity="0.85"/>
  <g stroke="#F5F5E9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M590 470 l-24 24 24 24"/>
    <path d="M650 470 l24 24 -24 24"/>
    <path d="M630 460 l-20 68"/>
  </g>
  <circle cx="696" cy="324" r="8" fill="#EFFF00"/>

  <!-- arrows clients -> gateway -->
  <path d="M290 308 C 400 308, 420 380, 510 390" stroke="#F5F5E9" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arr)"/>
  <path d="M250 590 C 380 590, 420 500, 510 500" stroke="#F5F5E9" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arr)"/>

  <!-- services (containers) -->
  <g stroke="#F5F5E9" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="8 8">
    <rect x="860" y="150" width="300" height="160" rx="18"/>
    <rect x="860" y="370" width="300" height="160" rx="18"/>
    <rect x="860" y="590" width="300" height="160" rx="18"/>
  </g>
  <g>
    <rect x="884" y="174" width="252" height="112" rx="14" fill="#F5F5E9"/>
    <rect x="884" y="394" width="252" height="112" rx="14" fill="#EFFF00"/>
    <rect x="884" y="614" width="252" height="112" rx="14" fill="#F5F5E9"/>
  </g>
  <!-- icons inside services -->
  <g stroke="#0B0D0F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="910" y="210" width="34" height="28" rx="5"/>
    <path d="M916 210 v-8 a11 11 0 0 1 22 0 v8"/>
    <circle cx="927" cy="652" r="10"/>
    <path d="M908 690 a19 16 0 0 1 38 0"/>
  </g>
  <g stroke="#0B0D0F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M908 424 h40 l-6 30 h-28 z"/>
    <circle cx="918" cy="464" r="4"/><circle cx="938" cy="464" r="4"/>
  </g>
  <g>
    <rect x="964" y="206" width="140" height="12" rx="6" fill="#0B0D0F" fill-opacity="0.85"/>
    <rect x="964" y="230" width="96" height="10" rx="5" fill="#A8ADB5" fill-opacity="0.5"/>
    <rect x="964" y="426" width="130" height="12" rx="6" fill="#0B0D0F"/>
    <rect x="964" y="450" width="90" height="10" rx="5" fill="#0B0D0F" fill-opacity="0.55"/>
    <rect x="964" y="646" width="150" height="12" rx="6" fill="#0B0D0F" fill-opacity="0.85"/>
    <rect x="964" y="670" width="80" height="10" rx="5" fill="#A8ADB5" fill-opacity="0.5"/>
  </g>

  <!-- gateway -> services -->
  <path d="M730 380 C 800 380, 800 230, 850 230" stroke="#F5F5E9" stroke-width="3" marker-end="url(#arr)"/>
  <path d="M730 450 H850" stroke="#EFFF00" stroke-width="4" marker-end="url(#arrB)"/>
  <path d="M730 520 C 800 520, 800 670, 850 670" stroke="#F5F5E9" stroke-width="3" marker-end="url(#arr)"/>

  <!-- database -->
  <g stroke="#F5F5E9" stroke-width="3">
    <path d="M1300 380 c0 -26 140 -26 140 0 v140 c0 26 -140 26 -140 0 z" fill="#191C20"/>
    <path d="M1300 380 c0 26 140 26 140 0" fill="none"/>
    <path d="M1300 426 c0 26 140 26 140 0 M1300 472 c0 26 140 26 140 0" fill="none" stroke-opacity="0.6"/>
  </g>
  <!-- cache -->
  <g stroke="#F5F5E9" stroke-width="3">
    <rect x="1296" y="186" width="148" height="90" rx="14" fill="#0B0D0F"/>
  </g>
  <path d="M1350 214 l-14 22 h14 l-6 22 22 -30 h-14 l8 -14 z" fill="#EFFF00"/>
  <rect x="1384" y="222" width="40" height="8" rx="4" fill="#F5F5E9" fill-opacity="0.6"/>
  <rect x="1384" y="238" width="28" height="8" rx="4" fill="#F5F5E9" fill-opacity="0.4"/>
  <!-- queue -->
  <g>
    <rect x="1290" y="620" width="160" height="70" rx="14" stroke="#F5F5E9" stroke-width="3"/>
    <rect x="1310" y="640" width="26" height="30" rx="5" fill="#EFFF00"/>
    <rect x="1346" y="640" width="26" height="30" rx="5" fill="#F5F5E9" fill-opacity="0.6"/>
    <rect x="1382" y="640" width="26" height="30" rx="5" fill="#F5F5E9" fill-opacity="0.35"/>
    <rect x="1418" y="640" width="14" height="30" rx="5" fill="#F5F5E9" fill-opacity="0.2"/>
  </g>

  <!-- services -> data stores -->
  <path d="M1170 230 H1286" stroke="#F5F5E9" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arr)"/>
  <path d="M1170 450 H1290" stroke="#EFFF00" stroke-width="4" marker-end="url(#arrB)"/>
  <path d="M1170 670 C 1230 670, 1230 520, 1300 500" stroke="#F5F5E9" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arr)"/>
  <path d="M1170 690 C 1220 690, 1240 660, 1280 656" stroke="#F5F5E9" stroke-width="3" marker-end="url(#arr)"/>

  <!-- dimension line + title block -->
  <g stroke="#F5F5E9" stroke-opacity="0.5" stroke-width="2">
    <path d="M520 640 V672 M720 640 V672 M520 660 H720"/>
  </g>
  <g stroke="#F5F5E9" stroke-opacity="0.35" stroke-width="2">
    <rect x="1180" y="790" width="370" height="70"/>
    <path d="M1300 790 V860 M1430 790 V860"/>
  </g>
  <g fill="#F5F5E9" fill-opacity="0.45">
    <rect x="1196" y="818" width="88" height="10" rx="5"/>
    <rect x="1316" y="818" width="96" height="10" rx="5"/>
    <rect x="1446" y="818" width="88" height="10" rx="5"/>
  </g>
  <g fill="#F5F5E9" fill-opacity="0.5">
    <circle cx="80" cy="820" r="7" fill="#EFFF00" fill-opacity="1"/><rect x="96" y="815" width="90" height="10" rx="5"/>
    <circle cx="232" cy="820" r="7"/><rect x="248" y="815" width="70" height="10" rx="5"/>
  </g>
</svg>
