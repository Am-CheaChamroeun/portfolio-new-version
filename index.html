<!doctype html>
<html lang="en" class="dark" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0D0F" />
    <!--seo:start-->
    <title>Roeun — Full-Stack Developer | Portfolio</title>
    <meta name="description" content="Portfolio of Roeun — full-stack developer building scalable, high-performance web applications with React, Next.js, TypeScript and NestJS." />
    <meta property="og:type" content="profile" />
    <meta property="og:title" content="Roeun — Full-Stack Developer | Portfolio" />
    <meta property="og:description" content="Portfolio of Roeun — full-stack developer building scalable, high-performance web applications with React, Next.js, TypeScript and NestJS." />
    <meta name="twitter:card" content="summary" />
    <!--seo:end-->
    <style>
      /* Crawler-readable copy that the app replaces on load — visually hidden, still available to assistive tech and bots */
      #prerender { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
      html { background: #0b0d0f; }
    </style>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      // Graphite (dark) is the default; warm paper is the light theme.
      try {
        // Saved language (en / km / zh-CN) — set <html lang> early so the right
        // fonts apply from the first paint. English is the default.
        const lang = localStorage.getItem('notebook-lang')
        if (lang === 'km' || lang === 'zh-CN') document.documentElement.lang = lang
        if (localStorage.getItem('notebook-theme-v2') === 'light') {
          document.documentElement.classList.remove('dark')
          document.documentElement.style.colorScheme = 'light'
        }
      } catch (e) {}
      // Saved Settings (accent, wallpaper, motion) — applied before first paint too.
      try {
        const el = document.documentElement
        const prefs = JSON.parse(localStorage.getItem('devos-settings') || 'null') || {}
        const accents = ['yellow', 'blue', 'emerald', 'purple', 'orange', 'white']
        const walls = ['grid', 'wave', 'geometric', 'topo']
        el.dataset.accent = accents.indexOf(prefs.accent) > -1 ? prefs.accent : 'yellow'
        el.dataset.wallpaper = walls.indexOf(prefs.wallpaper) > -1 ? prefs.wallpaper : 'grid'
        const os = matchMedia('(prefers-reduced-motion: reduce)').matches
        el.dataset.motion = prefs.motion === 'reduced' || (prefs.motion !== 'full' && os) ? 'reduced' : 'full'
      } catch (e) {}
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
